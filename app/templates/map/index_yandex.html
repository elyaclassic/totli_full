{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h4><i class="bi bi-geo-alt"></i> Real vaqtda xarita (Yandex Maps)</h4>
    <div>
        <button class="btn btn-sm btn-outline-primary" onclick="refreshLocations()">
            <i class="bi bi-arrow-clockwise"></i> Yangilash
        </button>
        <button class="btn btn-sm btn-outline-success" onclick="toggleAutoRefresh()">
            <i class="bi bi-play-fill" id="autoRefreshIcon"></i> Avtomatik
        </button>
    </div>
</div>

<!-- Filtrlar -->
<div class="row mb-3">
    <div class="col-md-8">
        <div class="btn-group" role="group">
            <input type="checkbox" class="btn-check" id="showAgents" checked>
            <label class="btn btn-outline-primary" for="showAgents">
                <i class="bi bi-person-walking"></i> Agentlar ({{ agents|length }})
            </label>

            <input type="checkbox" class="btn-check" id="showDrivers" checked>
            <label class="btn btn-outline-info" for="showDrivers">
                <i class="bi bi-truck"></i> Haydovchilar ({{ drivers|length }})
            </label>

            <input type="checkbox" class="btn-check" id="showPartners" checked>
            <label class="btn btn-outline-success" for="showPartners">
                <i class="bi bi-shop"></i> Mijozlar ({{ partner_locations|length }})
            </label>
        </div>
    </div>
    <div class="col-md-4 text-end">
        <span class="text-muted" id="lastUpdate">Oxirgi yangilanish: -</span>
    </div>
</div>

<!-- Xarita -->
<div class="card">
    <div class="card-body p-0">
        <div id="mainMap" style="height: 70vh; min-height: 500px;"></div>
    </div>
</div>

<!-- Legend -->
<div class="card mt-3">
    <div class="card-body py-2">
        <div class="d-flex justify-content-around">
            <span><i class="bi bi-circle-fill text-primary"></i> Agent</span>
            <span><i class="bi bi-circle-fill text-info"></i> Haydovchi</span>
            <span><i class="bi bi-circle-fill text-success"></i> Mijoz</span>
            <span><i class="bi bi-circle-fill text-danger"></i> Offline (1 soat+)</span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    #mainMap {
        width: 100%;
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://api-maps.yandex.ru/2.1/?lang=uz_UZ" type="text/javascript"></script>
<script>
    var map;
    var agentMarkers = [];
    var driverMarkers = [];
    var partnerMarkers = [];
    var autoRefresh = false;
    var refreshInterval = null;

    // Yandex Maps yuklanishi
    ymaps.ready(init);

    function init() {
        // Xarita yaratish - Toshkent markazi
        map = new ymaps.Map('mainMap', {
            center: [41.311081, 69.240562],
            zoom: 12,
            controls: ['zoomControl', 'searchControl', 'typeSelector', 'fullscreenControl', 'routeButtonControl']
        });

        // Boshlang'ich yuklash
        loadAllMarkers();

        // Auto-fit bounds
        setTimeout(function () {
            if (agentMarkers.length + driverMarkers.length + partnerMarkers.length > 0) {
                var bounds = map.geoObjects.getBounds();
                if (bounds) {
                    map.setBounds(bounds, {
                        checkZoomRange: true,
                        zoomMargin: 50
                    });
                }
            }
        }, 500);
    }

    function isOffline(timestamp) {
        var now = new Date();
        var recordedAt = new Date(timestamp);
        return (now - recordedAt) > 3600000; // 1 soat
    }

    // Marker yaratish
    function createPlacemark(coords, content, type, isOffline) {
        var iconColor = type === 'agent' ? '#0d6efd' :
            type === 'driver' ? '#0dcaf0' : '#198754';

        if (isOffline) iconColor = '#dc3545';

        var iconContent = type === 'agent' ? '👤' :
            type === 'driver' ? '🚚' : '🏪';

        var placemark = new ymaps.Placemark(coords, {
            balloonContent: content,
            iconContent: iconContent
        }, {
            preset: 'islands#circleIcon',
            iconColor: iconColor
        });

        return placemark;
    }

    // Agentlarni yuklash
    function loadAgents() {
        // Eski markerlarni o'chirish
        agentMarkers.forEach(function (marker) {
            map.geoObjects.remove(marker);
        });
        agentMarkers = [];

        {% for agent in agents %}
        {% if agent.locations %}
        {% set loc = agent.locations[0] %}
        var offline = isOffline('{{ loc.recorded_at.isoformat() }}');
        var content = '<div style="padding: 10px;">' +
            '<b>{{ agent.full_name }}</b><br>' +
            '<small>{{ agent.region or "Hudud yo\'q" }}</small><br>' +
            '<small>🔋 {{ loc.battery }}%</small><br>' +
            '<a href="/agents/{{ agent.id }}" class="btn btn-sm btn-primary mt-2">Batafsil</a>' +
            '</div>';

        var marker = createPlacemark([{{ loc.latitude }}, { { loc.longitude } }], content, 'agent', offline);
    map.geoObjects.add(marker);
    agentMarkers.push(marker);
    {% endif %}
    {% endfor %}
    }

    // Haydovchilarni yuklash
    function loadDrivers() {
        // Eski markerlarni o'chirish
        driverMarkers.forEach(function (marker) {
            map.geoObjects.remove(marker);
        });
        driverMarkers = [];

        {% for driver in drivers %}
        {% if driver.locations %}
        {% set loc = driver.locations[0] %}
        var offline = isOffline('{{ loc.recorded_at.isoformat() }}');
        var content = '<div style="padding: 10px;">' +
            '<b>{{ driver.full_name }}</b><br>' +
            '<small>{{ driver.vehicle_type }} - {{ driver.vehicle_number }}</small><br>' +
            '{% if loc.speed %}<small>🚗 {{ "%.0f"|format(loc.speed) }} km/h</small><br>{% endif %}' +
            '<a href="/delivery/{{ driver.id }}" class="btn btn-sm btn-info mt-2">Batafsil</a>' +
            '</div>';

        var marker = createPlacemark([{{ loc.latitude }}, { { loc.longitude } }], content, 'driver', offline);
    map.geoObjects.add(marker);
    driverMarkers.push(marker);
    {% endif %}
    {% endfor %}
    }

    // Mijozlarni yuklash
    function loadPartners() {
        // Eski markerlarni o'chirish
        partnerMarkers.forEach(function (marker) {
            map.geoObjects.remove(marker);
        });
        partnerMarkers = [];

        {% for ploc in partner_locations %}
        var content = '<div style="padding: 10px;">' +
            '<b>Mijoz #{{ ploc.partner_id }}</b><br>' +
            '<small>{{ ploc.address or "Manzil yo\'q" }}</small>' +
            '</div>';

        var marker = createPlacemark([{{ ploc.latitude }}, { { ploc.longitude } }], content, 'partner', false);
    map.geoObjects.add(marker);
    partnerMarkers.push(marker);
    {% endfor %}
    }

    // Barchasini yuklash
    function loadAllMarkers() {
        if (!map) return;

        loadAgents();
        loadDrivers();
        loadPartners();
        document.getElementById('lastUpdate').textContent =
            'Oxirgi yangilanish: ' + new Date().toLocaleTimeString('uz-UZ');
    }

    // API dan yangilash
    function refreshLocations() {
        Promise.all([
            fetch('/api/agents/locations').then(r => r.json()),
            fetch('/api/drivers/locations').then(r => r.json())
        ]).then(function ([agentsData, driversData]) {
            // Agent markerlarni yangilash
            agentMarkers.forEach(function (marker) {
                map.geoObjects.remove(marker);
            });
            agentMarkers = [];

            agentsData.forEach(function (agent) {
                var offline = isOffline(agent.time);
                var content = '<div style="padding: 10px;"><b>' + agent.name + '</b><br>' +
                    '<small>🔋 ' + agent.battery + '%</small></div>';
                var marker = createPlacemark([agent.lat, agent.lng], content, 'agent', offline);
                map.geoObjects.add(marker);
                agentMarkers.push(marker);
            });

            // Driver markerlarni yangilash
            driverMarkers.forEach(function (marker) {
                map.geoObjects.remove(marker);
            });
            driverMarkers = [];

            driversData.forEach(function (driver) {
                var offline = isOffline(driver.time);
                var content = '<div style="padding: 10px;"><b>' + driver.name + '</b><br>' +
                    '<small>🚗 ' + (driver.speed || 0).toFixed(0) + ' km/h</small></div>';
                var marker = createPlacemark([driver.lat, driver.lng], content, 'driver', offline);
                map.geoObjects.add(marker);
                driverMarkers.push(marker);
            });

            document.getElementById('lastUpdate').textContent =
                'Oxirgi yangilanish: ' + new Date().toLocaleTimeString('uz-UZ');
        });
    }

    // Avtomatik yangilash
    function toggleAutoRefresh() {
        autoRefresh = !autoRefresh;
        var icon = document.getElementById('autoRefreshIcon');

        if (autoRefresh) {
            icon.className = 'bi bi-pause-fill';
            refreshInterval = setInterval(refreshLocations, 30000); // 30 sek
        } else {
            icon.className = 'bi bi-play-fill';
            if (refreshInterval) clearInterval(refreshInterval);
        }
    }

    // Filtr toggle
    document.getElementById('showAgents').addEventListener('change', function () {
        agentMarkers.forEach(function (marker) {
            marker.options.set('visible', this.checked);
        }.bind(this));
    });

    document.getElementById('showDrivers').addEventListener('change', function () {
        driverMarkers.forEach(function (marker) {
            marker.options.set('visible', this.checked);
        }.bind(this));
    });

    document.getElementById('showPartners').addEventListener('change', function () {
        partnerMarkers.forEach(function (marker) {
            marker.options.set('visible', this.checked);
        }.bind(this));
    });
</script>
{% endblock %}
