{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h4><i class="bi bi-geo-alt"></i> Real vaqtda xarita</h4>
    <div>
        <button class="btn btn-sm btn-outline-primary" onclick="refreshLocations()">
            <i class="bi bi-arrow-clockwise"></i> Yangilash
        </button>
        <button class="btn btn-sm btn-outline-success" onclick="toggleAutoRefresh()">
            <i class="bi bi-play-fill" id="autoRefreshIcon"></i> Avtomatik
        </button>
    </div>
</div>

<!-- Filtrlar -->
<div class="row mb-3">
    <div class="col-md-8">
        <div class="btn-group" role="group">
            <input type="checkbox" class="btn-check" id="showAgents" checked>
            <label class="btn btn-outline-primary" for="showAgents">
                <i class="bi bi-person-walking"></i> Agentlar ({{ agents|length }})
            </label>

            <input type="checkbox" class="btn-check" id="showDrivers" checked>
            <label class="btn btn-outline-info" for="showDrivers">
                <i class="bi bi-truck"></i> Haydovchilar ({{ drivers|length }})
            </label>

            <input type="checkbox" class="btn-check" id="showPartners" checked>
            <label class="btn btn-outline-success" for="showPartners">
                <i class="bi bi-shop"></i> Mijozlar ({{ partner_locations|length }})
            </label>
        </div>
    </div>
    <div class="col-md-4 text-end">
        <span class="text-muted" id="lastUpdate">Oxirgi yangilanish: -</span>
    </div>
</div>

<!-- Xarita -->
<div class="card">
    <div class="card-body p-0">
        <div id="mainMap" style="height: 70vh; min-height: 500px;"></div>
    </div>
</div>

<!-- Legend -->
<div class="card mt-3">
    <div class="card-body py-2">
        <div class="d-flex justify-content-around">
            <span><i class="bi bi-circle-fill text-primary"></i> Agent</span>
            <span><i class="bi bi-circle-fill text-info"></i> Haydovchi</span>
            <span><i class="bi bi-circle-fill text-success"></i> Mijoz</span>
            <span><i class="bi bi-circle-fill text-danger"></i> Offline (1 soat+)</span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    #mainMap {
        width: 100%;
    }

    .agent-marker {
        background: #0d6efd;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        font-weight: bold;
    }

    .driver-marker {
        background: #0dcaf0;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        font-weight: bold;
    }

    .partner-marker {
        background: #198754;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        font-weight: bold;
    }

    .offline-marker {
        background: #dc3545 !important;
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script>
    // Xarita o'rnatish - Toshkent markazi
    var map = L.map('mainMap').setView([41.311081, 69.240562], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Marker layerlar
    var agentMarkers = L.layerGroup().addTo(map);
    var driverMarkers = L.layerGroup().addTo(map);
    var partnerMarkers = L.layerGroup().addTo(map);

    var autoRefresh = false;
    var refreshInterval = null;

    // Ikonkalar
    function createMarkerIcon(type, isOffline) {
        var bgClass = type === 'agent' ? 'agent-marker' :
            type === 'driver' ? 'driver-marker' : 'partner-marker';
        var icon = type === 'agent' ? 'person-fill' :
            type === 'driver' ? 'truck-front-fill' : 'shop';

        if (isOffline) bgClass += ' offline-marker';

        return L.divIcon({
            html: '<div class="custom-marker ' + bgClass + '"><i class="bi bi-' + icon + '"></i></div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: ''
        });
    }

    function isOffline(timestamp) {
        var now = new Date();
        var recordedAt = new Date(timestamp);
        return (now - recordedAt) > 3600000; // 1 soat
    }

    // Agentlarni yuklash
    function loadAgents() {
        agentMarkers.clearLayers();

        {% for agent in agents %}
        {% if agent.locations %}
        {% set loc = agent.locations[0] %}
        var offline = isOffline('{{ loc.recorded_at.isoformat() }}');
        var marker = L.marker([{{ loc.latitude }}, { { loc.longitude } }], {
        icon: createMarkerIcon('agent', offline)
    });
    marker.bindPopup(
        '<b>{{ agent.full_name }}</b><br>' +
        '<small>{{ agent.region or "Hudud yo\'q" }}</small><br>' +
        '<small>🔋 {{ loc.battery }}%</small><br>' +
        '<a href="/agents/{{ agent.id }}" class="btn btn-sm btn-primary mt-2">Batafsil</a>'
    );
    agentMarkers.addLayer(marker);
    {% endif %}
    {% endfor %}
    }

    // Haydovchilarni yuklash
    function loadDrivers() {
        driverMarkers.clearLayers();

        {% for driver in drivers %}
        {% if driver.locations %}
        {% set loc = driver.locations[0] %}
        var offline = isOffline('{{ loc.recorded_at.isoformat() }}');
        var marker = L.marker([{{ loc.latitude }}, { { loc.longitude } }], {
        icon: createMarkerIcon('driver', offline)
    });
    marker.bindPopup(
        '<b>{{ driver.full_name }}</b><br>' +
        '<small>{{ driver.vehicle_type }} - {{ driver.vehicle_number }}</small><br>' +
        '{% if loc.speed %}<small>🚗 {{ "%.0f"|format(loc.speed) }} km/h</small><br>{% endif %}' +
        '<a href="/delivery/{{ driver.id }}" class="btn btn-sm btn-info mt-2">Batafsil</a>'
    );
    driverMarkers.addLayer(marker);
    {% endif %}
    {% endfor %}
    }

    // Mijozlarni yuklash
    function loadPartners() {
        partnerMarkers.clearLayers();

        {% for ploc in partner_locations %}
        var marker = L.marker([{{ ploc.latitude }}, { { ploc.longitude } }], {
        icon: createMarkerIcon('partner', false)
    });
    marker.bindPopup(
        '<b>Mijoz #{{ ploc.partner_id }}</b><br>' +
        '<small>{{ ploc.address or "Manzil yo\'q" }}</small>'
    );
    partnerMarkers.addLayer(marker);
    {% endfor %}
    }

    // Barchasini yuklash
    function loadAllMarkers() {
        loadAgents();
        loadDrivers();
        loadPartners();
        document.getElementById('lastUpdate').textContent =
            'Oxirgi yangilanish: ' + new Date().toLocaleTimeString('uz-UZ');
    }

    // API dan yangilash
    function refreshLocations() {
        Promise.all([
            fetch('/api/agents/locations').then(r => r.json()),
            fetch('/api/drivers/locations').then(r => r.json())
        ]).then(function ([agentsData, driversData]) {
            // Agent markerlarni yangilash
            agentMarkers.clearLayers();
            agentsData.forEach(function (agent) {
                var offline = isOffline(agent.time);
                var marker = L.marker([agent.lat, agent.lng], {
                    icon: createMarkerIcon('agent', offline)
                });
                marker.bindPopup(
                    '<b>' + agent.name + '</b><br>' +
                    '<small>🔋 ' + agent.battery + '%</small>'
                );
                agentMarkers.addLayer(marker);
            });

            // Driver markerlarni yangilash
            driverMarkers.clearLayers();
            driversData.forEach(function (driver) {
                var offline = isOffline(driver.time);
                var marker = L.marker([driver.lat, driver.lng], {
                    icon: createMarkerIcon('driver', offline)
                });
                marker.bindPopup(
                    '<b>' + driver.name + '</b><br>' +
                    '<small>🚗 ' + (driver.speed || 0).toFixed(0) + ' km/h</small>'
                );
                driverMarkers.addLayer(marker);
            });

            document.getElementById('lastUpdate').textContent =
                'Oxirgi yangilanish: ' + new Date().toLocaleTimeString('uz-UZ');
        });
    }

    // Avtomatik yangilash
    function toggleAutoRefresh() {
        autoRefresh = !autoRefresh;
        var icon = document.getElementById('autoRefreshIcon');

        if (autoRefresh) {
            icon.className = 'bi bi-pause-fill';
            refreshInterval = setInterval(refreshLocations, 30000); // 30 sek
        } else {
            icon.className = 'bi bi-play-fill';
            if (refreshInterval) clearInterval(refreshInterval);
        }
    }

    // Filtr toggle
    document.getElementById('showAgents').addEventListener('change', function () {
        if (this.checked) agentMarkers.addTo(map);
        else map.removeLayer(agentMarkers);
    });

    document.getElementById('showDrivers').addEventListener('change', function () {
        if (this.checked) driverMarkers.addTo(map);
        else map.removeLayer(driverMarkers);
    });

    document.getElementById('showPartners').addEventListener('change', function () {
        if (this.checked) partnerMarkers.addTo(map);
        else map.removeLayer(partnerMarkers);
    });

    // Boshlang'ich yuklash
    loadAllMarkers();

    // Barcha markerlarni ko'rsatadigan qilib zoom qilish
    var allMarkers = [];
    {% for agent in agents %} {% if agent.locations %}
    allMarkers.push([{{ agent.locations[0].latitude }}, {{ agent.locations[0].longitude }}]);
    {% endif %} {% endfor %}
    {% for driver in drivers %} {% if driver.locations %}
    allMarkers.push([{{ driver.locations[0].latitude }}, {{ driver.locations[0].longitude }}]);
    {% endif %} {% endfor %}
    {% for ploc in partner_locations %}
    allMarkers.push([{{ ploc.latitude }}, {{ ploc.longitude }}]);
    {% endfor %}

    if (allMarkers.length > 0) {
        map.fitBounds(allMarkers);
    }
</script>
{% endblock %}
